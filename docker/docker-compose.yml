# Accessible uniquement via NPM (réseau Docker `proxy`).
# Proxy Host : sutom-solver.domaine.fr → sutom-solver:50103

name: sutom-solver

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/fryzhen/sutom-solver:latest
    container_name: sutom-solver
    restart: unless-stopped
    logging: *default-logging
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M
        reservations:
          memory: 8M

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
