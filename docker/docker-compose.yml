# Accessible uniquement via NPM (réseau Docker `proxy`).
# Proxy Host : sutom-solver.domaine.fr → sutom-solver:50103

name: sutom-solver

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sutom-solver:latest
    container_name: sutom-solver
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
